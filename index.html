<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public IP Information</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            background-color: #2c3e50;
            color: #ecf0f1;
            text-align: center;
        }
        #info {
            font-size: 24px;
            margin: 10px 0;
        }
        #flag {
            margin: 10px 0;
        }
        #flag img {
            width: 64px;
            height: auto;
            border-radius: 5px;
        }
        button {
            font-size: 18px;
            padding: 10px 20px;
            cursor: pointer;
            background-color: #34495e;
            color: #ecf0f1;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
            margin: 5px;
        }
        button:hover {
            background-color: #465c73;
        }
        .loading {
            font-size: 20px;
            margin-top: 20px;
        }
        .notification {
            background-color: rgba(255, 152, 0, 0.2);
            border-left: 4px solid #ff9800;
            padding: 10px 15px;
            margin: 15px 0;
            border-radius: 3px;
            max-width: 600px;
            text-align: left;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="info">
        <div id="ipv4">Loading IPv4...</div>
        <div id="ipv6">Loading IPv6...</div>
        <div id="country"></div>
        <div id="flag"></div>
        <div id="privacy-notice" class="notification" style="display: none;">
            Nota: Stai utilizzando un servizio di privacy (come iCloud Private Relay). 
            Le informazioni sull'IP potrebbero non essere accurate.
        </div>
    </div>
    <div>
        <button onclick="copyIP('ipv4')">Copy IPv4</button>
        <button onclick="copyIP('ipv6')">Copy IPv6</button>
        <button onclick="refreshIP()">Refresh</button>
    </div>
    <script>
        async function getIPInfo() {
            try {
                // Funzione per validare formato IPv4
                function isValidIPv4(ip) {
                    const ipv4Regex = /^(\d{1,3}\.){3}\d{1,3}$/;
                    return ipv4Regex.test(ip);
                }

                // Funzione per validare formato IPv6
                function isValidIPv6(ip) {
                    // Controllo basilare - un IPv6 valido contiene almeno un ":"
                    return ip.includes(':') && ip.length > 7;
                }

                // Tenta di ottenere IPv4 da più fonti
                let ipv4 = null;
                let countryName = null;
                let countryCode = null;

                // Prima fonte: ipapi.co
                try {
                    const ipv4Response = await fetch('https://ipapi.co/json/');
                    const ipv4Data = await ipv4Response.json();
                    
                    if (ipv4Data.ip && isValidIPv4(ipv4Data.ip)) {
                        ipv4 = ipv4Data.ip;
                        countryName = ipv4Data.country_name;
                        countryCode = ipv4Data.country_code;
                    }
                } catch (error) {
                    console.log('Prima fonte IPv4 fallita, provo altra fonte');
                }

                // Seconda fonte alternativa per IPv4 se la prima fallisce
                if (!ipv4) {
                    try {
                        const ipv4AltResponse = await fetch('https://api.ipify.org?format=json');
                        const ipv4AltData = await ipv4AltResponse.json();
                        
                        if (ipv4AltData.ip && isValidIPv4(ipv4AltData.ip)) {
                            ipv4 = ipv4AltData.ip;
                            
                            // Se abbiamo l'IP ma non il paese, proviamo a ottenere le info sul paese
                            if (!countryName) {
                                try {
                                    const geoResponse = await fetch(`https://ipapi.co/${ipv4}/json/`);
                                    const geoData = await geoResponse.json();
                                    countryName = geoData.country_name;
                                    countryCode = geoData.country_code;
                                } catch (geoError) {
                                    console.error('Errore recupero dati geografici:', geoError);
                                }
                            }
                        }
                    } catch (altError) {
                        console.error('Anche la fonte alternativa IPv4 è fallita:', altError);
                    }
                }

                // Aggiorna UI per IPv4
                if (ipv4) {
                    document.getElementById('ipv4').textContent = `IPv4: ${ipv4}`;
                } else {
                    document.getElementById('ipv4').textContent = 'IPv4: Non rilevato correttamente';
                }

                // Aggiorna UI per paese e bandiera
                if (countryName) {
                    document.getElementById('country').textContent = countryName;
                    if (countryCode) {
                        displayFlag(countryCode);
                    }
                } else {
                    document.getElementById('country').textContent = 'Paese non rilevato';
                    document.getElementById('flag').innerHTML = '';
                }

                // Tenta di ottenere IPv6
                let ipv6 = null;
                
                try {
                    const ipv6Response = await fetch('https://api64.ipify.org?format=json');
                    const ipv6Data = await ipv6Response.json();
                    
                    if (ipv6Data.ip && isValidIPv6(ipv6Data.ip)) {
                        ipv6 = ipv6Data.ip;
                    } else if (ipv6Data.ip && isValidIPv4(ipv6Data.ip)) {
                        // A volte api64.ipify.org restituisce un IPv4 quando IPv6 non è disponibile
                        console.log('api64.ipify.org ha restituito un IPv4 invece di un IPv6');
                    }
                } catch (ipv6Error) {
                    console.error('Errore recupero IPv6:', ipv6Error);
                }

                // Fonte alternativa per IPv6 se la prima fallisce
                if (!ipv6) {
                    try {
                        const ipv6AltResponse = await fetch('https://api-ipv6.ip.sb/ip');
                        const ipv6AltText = await ipv6AltResponse.text();
                        
                        if (ipv6AltText && isValidIPv6(ipv6AltText.trim())) {
                            ipv6 = ipv6AltText.trim();
                        }
                    } catch (altIpv6Error) {
                        console.error('Anche la fonte alternativa IPv6 è fallita:', altIpv6Error);
                    }
                }

                // Aggiorna UI per IPv6
                if (ipv6) {
                    document.getElementById('ipv6').textContent = `IPv6: ${ipv6}`;
                } else {
                    document.getElementById('ipv6').textContent = 'IPv6: Non disponibile';
                }

                // Controlla se l'utente sta usando Private Relay o servizi simili
                detectPrivacyService(ipv4, countryName);

            } catch (error) {
                console.error('Errore generale recupero info IP:', error);
                document.getElementById('ipv4').textContent = 'Errore recupero informazioni IP';
                document.getElementById('ipv6').textContent = '';
                document.getElementById('country').textContent = '';
                document.getElementById('flag').innerHTML = '';
            }
        }

        function detectPrivacyService(ip, country) {
            const privacyNotice = document.getElementById('privacy-notice');
            
            // Controlla indizi comuni di servizi di privacy
            const isPrivacyService = 
                (ip && (
                    ip.startsWith('172.224.') || // Range comuni per Private Relay
                    ip.startsWith('172.225.') ||
                    ip.startsWith('172.226.') ||
                    ip.startsWith('172.227.') ||
                    ip.startsWith('172.228.') ||
                    ip.startsWith('172.229.') ||
                    ip.startsWith('172.230.') ||
                    ip.startsWith('172.231.') ||
                    ip.startsWith('17.') // Apple IP ranges
                )) ||
                (navigator.userAgent.includes('iPhone') && navigator.userAgent.includes('Safari') && !navigator.userAgent.includes('Chrome')) || // Safari su iPhone (potenziale utilizzo di Private Relay)
                (country && country.includes('Relay')); // Alcuni servizi inseriscono "Relay" nel paese
            
            privacyNotice.style.display = isPrivacyService ? 'block' : 'none';
        }

        function displayFlag(countryCode) {
            const flagElement = document.getElementById('flag');
            const flagUrl = `https://flagcdn.com/w80/${countryCode.toLowerCase()}.png`;
            flagElement.innerHTML = `<img src="${flagUrl}" alt="Country flag">`;
        }

        function copyIP(type) {
            const ipElement = document.getElementById(type);
            if (ipElement.textContent.includes(': ')) {
                const ip = ipElement.textContent.split(': ')[1];
                navigator.clipboard.writeText(ip)
                    .then(() => alert(`${type.toUpperCase()} copied to clipboard!`))
                    .catch(err => console.error('Error copying IP:', err));
            } else {
                alert('No IP address to copy');
            }
        }

        function refreshIP() {
            document.getElementById('ipv4').textContent = 'Loading IPv4...';
            document.getElementById('ipv6').textContent = 'Loading IPv6...';
            document.getElementById('country').textContent = '';
            document.getElementById('flag').innerHTML = '';
            document.getElementById('privacy-notice').style.display = 'none';
            getIPInfo();
        }

        // Inizializza al caricamento della pagina
        getIPInfo();
    </script>
</body>
</html>
